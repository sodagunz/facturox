[package]
name = "einvoice"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "=6.0.0"
iced = { version = "=0.14.0", features = ["tokio"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "=1.53.3", features = ["fs"] }
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt"] }
