[workspace]
members = ["facturox-core", "facturox-native"]
resolver = "3"

[workspace.dependencies]

color-eyre = "0.6"
directories = "6"
facturox-core = { path = "facturox-core" }
iced = { version = "0.14", features = ["tokio"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# arithmetic_side_effects = "deny" # TODO: eventually if we want to be super pedantic we should choose to wrap, saturate or fail.
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev.package."*"]
opt-level = 2
