name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify host target
        shell: bash
        run: rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Install project toolchain
        shell: bash
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::pedantic
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: einvoice-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/einvoice${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies and licenses
        run: cargo deny --locked check advisories licenses sources
