[advisories]
# These unmaintained dependencies are pulled in by Iced; no safe upgrade is
# currently available through the versions it uses. Revisit when updating Iced.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive Iced dependency with no available upgrade" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is a transitive Iced dependency with no available upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is a transitive Iced dependency with no available upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is a transitive Iced dependency with no available upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is a transitive Iced dependency with no available upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is a transitive Iced dependency with no available upgrade" },
]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "hexf-parse"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
